[project]
name = "cybit-ticket-triage"
version = "0.3.0"
description = "AI Service-Desk Copilot for Cybit (Stage 1 Pilot)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "advisory_generator",
    "advisory_matcher",
    "advisory_models",
    "api",
    "app",
    "benchmark_models",
    "blind_testset",
    "config",
    "drift_evaluator",
    "embeddings",
    "evaluate",
    "guardrails",
    "kb_and_data",
    "qbr_generator",
    "qbr_models",
    "redaction",
    "retrieval",
    "scorecard",
    "soc_analyzer",
    "soc_models",
    "storage",
    "triage",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
